name: Build, Lint and Deploy NexusControl

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run lint

      - name: Build frontend distribution
        run: npm run build

  # Deployment step (Triggered on push to main branch in your private repo)
  deploy-cloud-run:
    name: Deploy to Google Cloud Run (Serverless Zero-VPS)
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only runs if GCP credentials secret is configured in your private repo settings
      - name: Authenticate to Google Cloud
        if: "${{ env.GCP_SA_KEY != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: "${{ env.GCP_SA_KEY != '' }}"
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Docker image
        if: "${{ env.GCP_SA_KEY != '' }}"
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/nexus-control:latest

      - name: Deploy to Cloud Run
        if: "${{ env.GCP_SA_KEY != '' }}"
        run: |
          gcloud run deploy nexus-control \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/nexus-control:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,ACTIVE_STORAGE_PROVIDER=google-drive" \
            --set-secrets "JWT_SECRET=nexus-jwt-secret:latest,GOOGLE_SERVICE_ACCOUNT_EMAIL=nexus-drive-email:latest,GOOGLE_PRIVATE_KEY=nexus-drive-key:latest"
